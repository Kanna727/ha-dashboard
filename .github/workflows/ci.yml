name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (example config)
        run: npm run build
      - name: Bundle checks
        run: |
          # The mock provider and any Google API key must never ship.
          test "$(grep -c MockProvider dist/index.html)" = 0
          test "$(grep -c AIza dist/index.html)" = 0
          # Entity IDs belong in the per-home config (stored in HA), not the bundle (the deploy helper is the one exception).
          ids=$(grep -oE '\b(light|fan|switch|sensor|binary_sensor|media_player|person|lock|climate|weather|device_tracker|input_boolean)\.[a-z0-9_]{3,}' dist/index.html || true)
          if [ -n "$ids" ]; then echo "Entity IDs in bundle:"; echo "$ids" | sort -u; exit 1; fi
      - name: Mock build
        run: VITE_MOCK=1 npx vite build --outDir dist-mock
      - name: Privacy check
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: scripts/privacy-check.sh

  pr-title:
    # Squash merges use the PR title as the commit message, and semantic-release
    # reads it to pick the next version, so it must be a Conventional Commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  visual:
    # Screenshots of the deterministic mock compared with tests/visual baselines.
    # After an intended visual change, run "Update visual baselines" on the PR's
    # branch, then re-run CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Mock build
        run: VITE_MOCK=1 npx vite build --outDir dist-mock
      - run: npx playwright test
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            playwright-report
            test-results
          retention-days: 7
