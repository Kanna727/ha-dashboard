name: Release

# Every merge to main: semantic-release reads the Conventional Commits since the
# last tag, and if any are feat/fix/perf (or breaking) it tags vX.Y.Z, updates
# CHANGELOG.md and publishes a GitHub Release with the built index.html.
# The deploy job then tells Home Assistant to install that release. Running the
# workflow by hand (Actions → Release → Run workflow) redeploys the latest release
# when there is nothing new to release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Privacy check
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: scripts/privacy-check.sh
      - name: Semantic release
        id: semrel
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    # HA is only reachable on the home network, so the runner joins the tailnet
    # as a short-lived node (tag:ci) and calls HA's deploy webhook. HA downloads
    # the release asset itself; no HA credentials are stored in GitHub.
    needs: release
    if: needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
      HA_HOST: ${{ vars.HA_TAILNET_HOST }}
      HAS_SECRETS: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.HA_WEBHOOK_ID != '' }}
    steps:
      - name: Check deploy setup
        if: env.HAS_SECRETS != 'true' || env.HA_HOST == ''
        run: |
          echo "::warning::Deploy skipped: set TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, HA_WEBHOOK_ID secrets and the HA_TAILNET_HOST variable (see README)."
      - name: Join tailnet
        if: env.HAS_SECRETS == 'true' && env.HA_HOST != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Trigger HA deploy
        if: env.HAS_SECRETS == 'true' && env.HA_HOST != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HA_WEBHOOK_ID: ${{ secrets.HA_WEBHOOK_ID }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName | sed 's/^v//')
          fi
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" --jq '.assets')
          # The repo is private, so hand HA short-lived signed download URLs
          # (valid ~5 min) instead of a token. index.html goes last, so the app
          # never references a file that isn't there yet.
          files='[]'
          for name in manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png index.html; do
            id=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .id' <<<"$assets")
            [ -n "$id" ] || continue
            u=$(curl -sS -o /dev/null -w '%{redirect_url}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id")
            test -n "$u"
            files=$(jq --arg n "$name" --arg u "$u" '. + [{name: $n, url: $u}]' <<<"$files")
          done
          url=$(jq -r '.[] | select(.name == "index.html") | .url' <<<"$files")
          test -n "$url"
          # `url` keeps older automations (index.html only) working.
          jq -n --arg version "$VERSION" --arg url "$url" --argjson files "$files" '{version: $version, url: $url, files: $files}' |
            curl -fsS --max-time 20 -X POST -H 'Content-Type: application/json' --data @- \
              "http://$HA_HOST/api/webhook/$HA_WEBHOOK_ID"
          echo "Asked Home Assistant to install v$VERSION"
