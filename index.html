<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0f17" />
    <!-- Add-to-home-screen / install as an app (served next to index.html, see public/) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <title>Home</title>
    <script>
      // Apply the last theme before first paint, so light mode doesn't flash dark.
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('dashTheme') || 'auto';
        if (t === 'auto') t = localStorage.getItem('dashThemeResolved') || 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
